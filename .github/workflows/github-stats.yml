name: Update GitHub stats

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate stats image
        run: python .github/scripts/update_stats.py
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN }}
          STATS_USER: akhilcj22
          EXCLUDED: ${{ secrets.EXCLUDED }}
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-stats.svg
          git diff --cached --quiet || (git commit -m "chore: update GitHub stats" && git push)
