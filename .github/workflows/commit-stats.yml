name: Update commit stats

on:
  schedule:
    - cron: "0 0 * * *"   # daily at midnight UTC (5:30 AM IST)
  workflow_dispatch:       # lets you run it manually

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update README
        run: python .github/scripts/update_commits.py
        env:
          GH_TOKEN: ${{ secrets.COMMITS_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || git commit -m "Update commit stats"
          git push
